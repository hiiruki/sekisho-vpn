name: E2E

# A real SSTP tunnel against a local SoftEther VPN Server: scripts/e2e.sh
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tunnel:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build SoftEther VPN Server
        run: |
          brew install cmake openssl@3 libsodium readline
          git clone --depth 1 --branch 5.2.5192 --recurse-submodules --shallow-submodules \
            https://github.com/SoftEtherVPN/SoftEtherVPN.git "$RUNNER_TEMP/se"
          cd "$RUNNER_TEMP/se"
          CMAKE_FLAGS="-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" ./configure
          make -C build -j"$(sysctl -n hw.ncpu)"

      - name: Tunnel test
        run: scripts/e2e.sh "$RUNNER_TEMP/se/build"

      - name: Helper log
        if: failure()
        run: cat /tmp/sstpd.log || true
