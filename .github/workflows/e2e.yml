name: E2E

# A real SSTP tunnel against a local SoftEther VPN Server (scripts/e2e.sh), plus the selftest, on the oldest and newest
# macOS the runners offer and on Intel (the x86_64 half of the universal build)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tunnel:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel] # macos-13 and macos-14 images are retired
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Selftest
        # `swift run` is SIGKILLed on the runners; the binary itself is fine
        run: swift build --product selftest && "$(swift build --show-bin-path)/selftest"

      - name: Build SoftEther VPN Server
        run: |
          brew install cmake openssl@3 libsodium readline
          # 5.2.5192, by commit: a tag in someone else's repository can be moved
          git init -q "$RUNNER_TEMP/se" && cd "$RUNNER_TEMP/se"
          git remote add origin https://github.com/SoftEtherVPN/SoftEtherVPN.git # submodule URLs may be relative to it
          git fetch -q --depth 1 origin 143abb3900c46136be0bb815269370cdda2ae286
          git checkout -q FETCH_HEAD
          git submodule update -q --init --depth 1 # submodules are pinned by the commit itself
          CMAKE_FLAGS="-DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" ./configure
          make -C build -j"$(sysctl -n hw.ncpu)"

      - name: Tunnel test
        run: scripts/e2e.sh "$RUNNER_TEMP/se/build"

      - name: Universal app starts on Intel
        if: matrix.os == 'macos-15-intel'
        run: |
          scripts/build-app.sh # arm64 is cross-compiled here, x86_64 native: the slice Intel Macs run
          A=build/app.noindex/Sekisho.app
          lipo -archs "$A/Contents/MacOS/SSTPClient" | grep -q x86_64
          "$A/Contents/Resources/sstpd" 2>&1 | grep -q "must run as root" # loads and runs its first line
          "$A/Contents/MacOS/SSTPClient" & p=$!
          sleep 10
          kill -0 $p # still running: frameworks loaded, UI up
          kill $p

      - name: Helper log
        if: failure()
        run: cat /tmp/sstpd.log || true
